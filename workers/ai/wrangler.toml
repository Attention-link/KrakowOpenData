# Kompas Krakowa AI Worker. Deploy: see README.md in this folder. NOT deployed automatically.
name = "krakow-ai"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true   # also reachable at https://krakow-ai.<account>.workers.dev (paths without /ai work too)

# Same origin as the site. "/ai/*" never matches "/api/*", so the API behind the tunnel is untouched.
routes = [
  { pattern = "opendata.al.mt/ai/*", zone_name = "al.mt" }
]

[ai]
binding = "AI"

# Public /ai/explain: 30 requests a minute per visitor IP (keyed calls from the API are not limited here).
# The key is the visitor's IP, and at a venue hundreds of phones share ONE public (NAT) address, so 6/min would lock
# out everyone after a handful of taps. Explain is already same-origin only and JSON only, so other sites cannot spend
# it; the free tier's daily neuron budget (and the optional KV cache below) is the real cap, not this limit.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

# Optional 24 h cache of triage / explain answers (saves neurons). Create it and paste the id, then uncomment:
#   npx wrangler kv namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<id printed by the command above>"

[vars]
# Check `npx wrangler ai models` before changing: llama-3.1-8b-instruct was deprecated 2026-05-30. Free tier: 10,000 neurons a day.
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
# /explain is plain text. A bigger model, e.g. "@cf/meta/llama-3.3-70b-instruct-fp8-fast", costs about 6x.
MODEL_EXPLAIN = "@cf/meta/llama-3.1-8b-instruct-fp8"
# "1" only with a triage model that supports JSON Schema output (llama-3.1-8b-instruct-fp8 answers 5025 "doesn't support JSON Schema").
TRIAGE_JSON_MODE = ""
WHISPER_MODEL = "@cf/openai/whisper-large-v3-turbo"
WHISPER_FALLBACK = "@cf/openai/whisper"
ALLOWED_ORIGIN = "https://opendata.al.mt"

# Secret (never in this file): npx wrangler secret put AI_KEY

[observability]
enabled = true
