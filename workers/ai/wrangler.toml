# Kompas Krakowa AI Worker. Deploy: see README.md in this folder. NOT deployed automatically.
name = "krakow-ai"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true   # also reachable at https://krakow-ai.<account>.workers.dev (paths without /ai work too)

# Same origin as the site. "/ai/*" never matches "/api/*", so the API behind the tunnel is untouched.
routes = [
  { pattern = "opendata.al.mt/ai/*", zone_name = "al.mt" }
]

[ai]
binding = "AI"

# Public /ai/explain: 6 requests a minute per visitor IP (keyed calls from the API are not limited here).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

# Optional 24 h cache of triage / explain answers (saves neurons). Create it and paste the id, then uncomment:
#   npx wrangler kv namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<id printed by the command above>"

[vars]
# Triage model: must support JSON mode (response_format); the "-fast" variant does not. Free tier: 10,000 neurons a day.
MODEL = "@cf/meta/llama-3.1-8b-instruct"
# /explain is plain text, so the cheaper "-fast" model is enough. A bigger one, e.g. "@cf/meta/llama-3.3-70b-instruct-fp8-fast", costs about 6x.
MODEL_EXPLAIN = "@cf/meta/llama-3.1-8b-instruct-fast"
WHISPER_MODEL = "@cf/openai/whisper-large-v3-turbo"
WHISPER_FALLBACK = "@cf/openai/whisper"
ALLOWED_ORIGIN = "https://opendata.al.mt"

# Secret (never in this file): npx wrangler secret put AI_KEY

[observability]
enabled = true
