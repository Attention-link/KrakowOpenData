# docker compose up --build   → API on http://localhost:5080, UI on http://localhost:5090
services:
  api:
    build:
      context: .
      dockerfile: src/KrakowOpenData.Api/Dockerfile
    environment:
      - Cors__AllowedOrigins__0=http://localhost:5090
      # Optional Telegram bot and Workers AI (see README, "AI (Cloudflare Workers AI) i Telegram"); empty = off.
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Telegram__BotUsername=${TELEGRAM_BOT_USERNAME:-}
      - Telegram__StaffChatId=${TELEGRAM_STAFF_CHAT_ID:-}
      - Telegram__Polling=${TELEGRAM_POLLING:-true}
      - Ai__BaseUrl=${AI_BASE_URL:-}
      - Ai__Key=${AI_KEY:-}
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "dotnet --info > /dev/null || exit 1"]
      interval: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/KrakowOpenData.Web/Dockerfile
    environment:
      - Api__BaseUrl=http://api:8080/
      - Safety__PublicApiBaseUrl=http://localhost:5080/
    ports:
      - "5090:8080"
    depends_on:
      - api
    restart: unless-stopped
