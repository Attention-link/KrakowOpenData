# docker compose up --build   → API on http://localhost:5080, UI on http://localhost:5090
# Set KRAKOW_SAMPLE=true for offline demos (no downloads).
services:
  api:
    build:
      context: .
      dockerfile: src/KrakowOpenData.Api/Dockerfile
    environment:
      - KrakowData__UseSampleData=${KRAKOW_SAMPLE:-false}
      - Cors__AllowedOrigins__0=http://localhost:5090
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "dotnet --info > /dev/null || exit 1"]
      interval: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/KrakowOpenData.Web/Dockerfile
    environment:
      - Api__BaseUrl=http://api:8080/
    ports:
      - "5090:8080"
    depends_on:
      - api
    restart: unless-stopped
